      - text: LPT-Cat is a curated catalog of
      - strong [ref=e11]: long-period radio transients (LPTs)
      - text: ", a mysterious population of radio sources characterized by minute- to hour-long periodicities. This catalog compiles published LPTs from the literature, including their positions, periods, spin-down constraints, dispersion measures (DM), rotation measures (RM), and key observational notes."
