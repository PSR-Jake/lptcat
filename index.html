<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LPT-Cat – Long-Period Transient Catalogue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
      line-height: 1.5;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    input#search {
      padding: 0.4rem 0.6rem;
      font-size: 1rem;
      margin-bottom: 1rem;
      width: 250px;
    }

    a {
      color: #1a73e8;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 0.4rem 0.6rem;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: #f2f2f2;
      cursor: pointer;
      user-select: none;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    ul#updates {
      list-style: disc inside;
      margin-bottom: 1rem;
    }

    footer {
      font-size: 0.85rem;
      color: #555;
      text-align: center;
      margin-top: 2rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .controls a {
      padding: 0.4rem 0.8rem;
      background-color: #1a73e8;
      color: white;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .controls a:hover {
      background-color: #1558b0;
    }
  </style>
</head>

<body>
  <h1>LPT-Cat: Long-Period Transient Catalogue</h1>

  <!-- Search + download -->
  <div class="controls">
    <input id="search" type="text" placeholder="Search the catalogue…" />
    <a href="LPTs.csv" download>Download CSV</a>
  </div>

  <!-- Catalogue Table -->
  <div class="table-wrapper">
    <table id="lpt-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Updates Section -->
  <h2>Recent Updates</h2>
  <ul id="updates"></ul>
  <a href="updates.csv">View full update history</a>

  <footer>
    Maintained by the LPT-Cat collaboration. Designed for long-timescale sky exploration.
  </footer>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
