<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LPT-Cat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 2rem;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      white-space: nowrap;
    }

    th {
      background: #f4f4f4;
    }

    th:hover {
      background: #eaeaea;
    }

    a {
      color: #2563eb;
      text-decoration: underline;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>LPT-Cat: Long-Period Transient Catalogue</h1>
  <p>Sortable catalogue with uncertainties integrated into values.</p>

  <p>
    <a href="LPTs.csv" download>Download full CSV</a>
  </p>

  <div style="overflow-x:auto;">
    <table id="lpt-table"></table>
  </div>

  <footer>
    Maintained by the LPT-Cat collaboration.
  </footer>

  <script src="script.js"></script>
</body>
</html>
